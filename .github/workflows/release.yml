name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # cmdline-tools 23.0 is the first release that ships the `android` CLI.
          cmdline-tools-version: "16111833"

      - name: Install SDK packages
        run: android sdk install platforms/android-37.0 build-tools/36.0.0

      - name: Quality gate
        run: scripts/gate.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # cmdline-tools 23.0 is the first release that ships the `android` CLI.
          cmdline-tools-version: "16111833"

      - name: Install SDK packages
        run: android sdk install platforms/android-37.0 build-tools/36.0.0

      - name: Check release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "KEYSTORE_BASE64 is empty: the release would be signed with the debug key." >&2
            exit 1
          fi

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > alarme-release.jks
          cat > keystore.properties <<EOF
          storeFile=alarme-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '${tag}' is not vX.Y.Z; refusing to build." >&2
            exit 1
          fi
          name="${tag#v}"
          IFS='.' read -r major minor patch <<< "${name%%-*}"
          code=$(( major * 10000 + minor * 100 + patch ))
          if (( code > 2100000000 )); then
            echo "Derived versionCode ${code} exceeds the Android limit." >&2
            exit 1
          fi
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "code=${code}" >> "${GITHUB_OUTPUT}"

      - name: Assemble release
        run: >-
          ./gradlew :app:assembleRelease
          -Palarme.versionName=${{ steps.version.outputs.name }}
          -Palarme.versionCode=${{ steps.version.outputs.code }}

      - name: Collect artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one release APK, found ${#apks[@]}." >&2
            exit 1
          fi
          cp "${apks[0]}" "dist/alarme-${VERSION_NAME}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${VERSION_NAME}.txt"
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ needs.build.outputs.name }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Alarme ${VERSION_NAME}" \
            --generate-notes \
            "dist/alarme-${VERSION_NAME}.apk" \
            "dist/mapping-${VERSION_NAME}.txt"

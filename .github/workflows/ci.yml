name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # cmdline-tools 23.0 is the first release that ships the `android` CLI.
          cmdline-tools-version: "16111833"

      - name: Install SDK packages
        run: android sdk install platforms/android-37.0 build-tools/36.0.0

      - name: Quality gate
        run: scripts/gate.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # cmdline-tools 23.0 is the first release that ships the `android` CLI.
          cmdline-tools-version: "16111833"

      - name: Install SDK packages
        run: android sdk install platforms/android-37.0 build-tools/36.0.0

      - name: Assemble release
        run: ./gradlew :app:assembleRelease
